[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-decisions"
version = "0.1.0"
description = "A jury of tiny open models: cheap, calibration-free zero-shot intent classification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jiunyi Yang" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "datasets>=2.18",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# The self-hosted decision service (define/train/predict + web console). Layer 1.5 (24-shot anchor) also needs
# a GPU and `peft` (installed via service/requirements.txt / the Docker image).
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.urls]
Homepage = "https://github.com/DataAgent-Lab/Quorum"

[tool.setuptools.packages.find]
include = ["quorum*", "service*"]
